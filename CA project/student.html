<!DOCTYPE html>
<html lang="en">

<head>

  <link rel="stylesheet" href="./css/student.css">
</head>

<body>
  <header class="topbar">

      <img class="topbar-left__logo" src="./images/icons/lpu logo.png">

        <span>Lovely</span>
        <span>Professional</span>
        <span>University</span>
      </div>
    </div>
    <div class="topbar-center">
      <button class="topbar-center__btn">home</button>
      <button class="topbar-center__btn">announcements</button>
    </div>
    <div class="topbar-right">
      <button class="topbar-right__btn">profile</button>

    <!--all faculty cards will appear here, to edit cards, modify scripts/faculty.js-->

  <section class="faculty-rating-menu__container">

      Work In Progress!
      <button id="closeFacultyRatingMenu" class="faculty-rating__btn--close">close</button>
