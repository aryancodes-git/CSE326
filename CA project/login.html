<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="css/loginpage.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Feedback</title>
</head>

<body class="login-body">
    <header class="index_header">
        <div class="header_content">
            <div class="logo_header">
                <abbr title="Go to home"><a href="index.html"><img src="images\lpulogo.png" alt="lpu header logo"></a></abbr>
            </div>
            <div class="header_nav">
                <ul>
                    <li class="home">
                        <abbr title="Home"><a href="index.html">Home</a></abbr>
                    </li>
                    <li class="connect-with-us">
                        <abbr title="Connect with us via AQS"><a href="connect_with_us.html">AQS</a></abbr>
                    </li>
                    <li class="about">
                        <abbr title="About us"><a href="about.html">About</a></abbr>
                    </li>
                </ul>
            </div>
            <div class="login-theme">
                <abbr title="Go to admin login"><a class="header-left-button" href="login.html">Admin</a></abbr>
                <abbr title="Go to student login"><a class="header-right-button" href="login.html">Login</a></abbr>
            </div>
        </div>
    </header>
    <div class="login-container">
        <div class="login-left-image">
            <img src="images/Lovely Professional University 1st in India.png" height="500">
        </div>
        <div class="login-right">

            <div class="login-form">

                <h1 class="login-title">Lovely Professional University</h1>
                <select id="login-selection">
                    <option value="admin">
                        Admin Login
                    </option>
                    <option value="faculty">
                        Faculty Login
                    </option>
                    <option value="student">
                        Student Login
                    </option>
                </select>
            </div>

            <form class="login-field" method="get">

                <div class="user-name">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required>
                </div>

                <div class="pass-word">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <div class="remember-me-forgot">
                    <label class="remember"><input type="checkbox">Remember me</label>
                    <a href="#" class="forgot">Forgot password?</a>
                </div>
            </div>
        </form>
        <div class="login-button">
            <button id="login-button">Login</button>
        </div>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
